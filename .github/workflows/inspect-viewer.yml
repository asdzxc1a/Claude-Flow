name: Inspect public viewer resolver
on:
  push:
    branches: ["main"]
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: Extract resolver code
        shell: bash
        run: |
          python - <<'PY'
          import re, requests
          u="https://picuki.site/js/app.js?id=dd573be95481622498e5086ebc4dbc9a"
          s=requests.Session(); s.headers["User-Agent"]="Mozilla/5.0"
          t=s.get(u,timeout=30).text
          print("LEN",len(t))
          needles=["handleSearchButtonClick","media-search","instagram-profile","profile-viewer","axios","fetch(","/api/","searchProfile","profileSearch","downloadMedia"]
          for needle in needles:
              starts=[m.start() for m in re.finditer(re.escape(needle),t,re.I)]
              print("\nNEEDLE",needle,"COUNT",len(starts))
              for pos in starts[:20]:
                  print("CTX",t[max(0,pos-1800):pos+3500])
          # Print suspicious quoted strings, deduped.
          vals=re.findall(r'["\']([^"\']{3,220})["\']',t)
          seen=set()
          for v in vals:
              lv=v.lower()
              if v in seen: continue
              if any(k in lv for k in ["instagram","profile","search","media","download","api/","graphql"]):
                  seen.add(v); print("STR",v)
          PY
