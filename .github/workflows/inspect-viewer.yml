name: Inspect public viewer resolver
on:
  push:
    branches: ["main"]
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: Probe Picuki worker API
        shell: bash
        run: |
          python - <<'PY'
          import json, requests
          s=requests.Session()
          s.headers.update({
            "User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36",
            "Accept":"application/json, text/plain, */*",
            "Origin":"https://picuki.site",
            "Referer":"https://picuki.site/",
          })
          root="https://api-wh.picuki.site/api/v1/instagram"
          tests=[
            ("profile",{"username":"arcana_events"}),
            ("userInfo",{"username":"arcana_events"}),
            ("postsV2",{"username":"arcana_events","maxId":""}),
            ("posts",{"username":"arcana_events","maxId":""}),
            ("usernameSuggestions",{"query":"arcana_events"}),
          ]
          for ep,body in tests:
            try:
              r=s.post(f"{root}/{ep}",json=body,timeout=30)
              print("ENDPOINT",ep,"STATUS",r.status_code,"CT",r.headers.get("content-type"),"LEN",len(r.content))
              print("HEAD",r.text[:12000])
            except Exception as e:
              print("ERR",ep,repr(e))
          PY
