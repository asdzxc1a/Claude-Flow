name: Download public Instagram media

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: pip install -q --upgrade instaloader gallery-dl requests
      - name: Fetch public media
        shell: bash
        run: |
          set +e
          mkdir -p raw selected

          echo "=== 1/3 Instagram public web API ==="
          timeout 90s python - <<'PY' || true
          import requests
          from pathlib import Path
          out=Path("raw")
          s=requests.Session()
          s.headers.update({"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36","Accept-Language":"en-US,en;q=0.9"})
          try:
              s.get("https://www.instagram.com/arcana_events/",timeout=10)
              h=dict(s.headers); h.update({"X-IG-App-ID":"936619743392459","X-Requested-With":"XMLHttpRequest","Referer":"https://www.instagram.com/arcana_events/"})
              r=s.get("https://www.instagram.com/api/v1/users/web_profile_info/?username=arcana_events",headers=h,timeout=15)
              print("web_profile_info",r.status_code,r.text[:250])
              r.raise_for_status()
              edges=r.json()["data"]["user"].get("edge_owner_to_timeline_media",{}).get("edges",[])
              nodes=[]
              for e in edges:
                  n=e.get("node",{})
                  ch=n.get("edge_sidecar_to_children",{}).get("edges")
                  nodes += [x.get("node",{}) for x in ch] if ch else [n]
              p=v=0
              for n in nodes:
                  if n.get("is_video") and v<3 and n.get("video_url"):
                      rr=s.get(n["video_url"],timeout=20); rr.raise_for_status(); v+=1
                      (out/f"api_video_{v}.mp4").write_bytes(rr.content); print("video",v,len(rr.content))
                  elif not n.get("is_video") and p<3 and n.get("display_url"):
                      rr=s.get(n["display_url"],timeout=20); rr.raise_for_status(); p+=1
                      ext=".webp" if "webp" in rr.headers.get("content-type","") else ".jpg"
                      (out/f"api_photo_{p}{ext}").write_bytes(rr.content); print("photo",p,len(rr.content))
                  if p>=3 and v>=3: break
          except Exception as e: print("API failed:",repr(e))
          PY

          echo "=== 2/3 gallery-dl ==="
          timeout 90s gallery-dl --range 1-20 --dest raw "https://www.instagram.com/arcana_events/" || true

          echo "=== 3/3 Instaloader ==="
          timeout 90s python - <<'PY' || true
          from pathlib import Path
          import instaloader
          def counts():
              r=Path("raw")
              return (len([p for p in r.rglob("*") if p.suffix.lower() in {".jpg",".jpeg",".png",".webp"}]),len(list(r.rglob("*.mp4"))))
          a,b=counts(); print("before:",a,b)
          if a<3 or b<3:
              try:
                  L=instaloader.Instaloader(dirname_pattern="raw/insta",filename_pattern="{date_utc:%Y-%m-%d}_{shortcode}_{filename}",download_pictures=True,download_videos=True,download_video_thumbnails=False,download_comments=False,download_geotags=False,save_metadata=False,post_metadata_txt_pattern="",quiet=False,max_connection_attempts=1,request_timeout=15)
                  p=instaloader.Profile.from_username(L.context,"arcana_events")
                  for i,post in enumerate(p.get_posts()):
                      L.download_post(post,target="arcana_events")
                      a,b=counts(); print("counts",a,b)
                      if a>=3 and b>=3: break
                      if i>=15: break
              except Exception as e: print("Instaloader failed:",repr(e))
          PY

          echo "=== Selecting exactly 3 + 3 ==="
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path("raw"); sel=Path("selected"); sel.mkdir(exist_ok=True)
          pics=[p for p in root.rglob("*") if p.is_file() and p.suffix.lower() in {".jpg",".jpeg",".png",".webp"} and "profile_pic" not in p.name.lower()]
          vids=[p for p in root.rglob("*.mp4") if p.is_file()]
          api_p=[p for p in pics if p.name.startswith("api_photo_")]; api_v=[p for p in vids if p.name.startswith("api_video_")]
          pics=api_p+[p for p in sorted(pics,key=lambda x:x.stat().st_size,reverse=True) if p not in api_p]
          vids=api_v+[p for p in sorted(vids,key=lambda x:x.stat().st_size,reverse=True) if p not in api_v]
          print("FOUND",len(pics),"photos",len(vids),"videos")
          for p in pics[:12]: print("PHOTO",p,p.stat().st_size)
          for p in vids[:12]: print("VIDEO",p,p.stat().st_size)
          if len(pics)<3 or len(vids)<3: raise SystemExit("INSUFFICIENT_MEDIA")
          for i,p in enumerate(pics[:3],1): shutil.copy2(p,sel/f"arcana_events_photo_{i}{p.suffix.lower()}")
          for i,p in enumerate(vids[:3],1): shutil.copy2(p,sel/f"arcana_events_video_{i}.mp4")
          print("SUCCESS_3_PHOTOS_3_VIDEOS")
          PY
      - name: Upload media
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arcana-events-media
          path: selected/
          if-no-files-found: warn
          retention-days: 1
