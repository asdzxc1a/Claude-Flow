name: Fetch Arcana media via Picuki worker
on:
  push:
    branches: ["main"]
  workflow_dispatch:
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q playwright requests
      - name: Resolve Arcana public profile
        shell: bash
        run: |
          mkdir -p selected debug
          timeout 180s python - <<'PY'
          import json, re, shutil
          from pathlib import Path
          from urllib.parse import urljoin
          from playwright.sync_api import sync_playwright

          target="arcana_events"
          out=Path("selected"); dbg=Path("debug")
          captured=[]
          urls=[]; seen=set()

          def add(u):
              if not isinstance(u,str) or not u.startswith("http"): return
              if u not in seen:
                  seen.add(u); urls.append(u)

          def walk(x):
              if isinstance(x,dict):
                  for k,v in x.items():
                      lk=str(k).lower()
                      if isinstance(v,str) and (v.startswith("http") or "url" in lk):
                          add(v)
                      walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
              elif isinstance(x,str) and x.startswith("http"):
                  add(x)

          with sync_playwright() as pw:
              chrome=shutil.which("google-chrome") or shutil.which("chromium")
              browser=pw.chromium.launch(headless=True, executable_path=chrome, args=["--no-sandbox","--disable-blink-features=AutomationControlled"])
              ctx=browser.new_context(
                  viewport={"width":1440,"height":1200},
                  locale="en-US",
                  user_agent="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36",
              )
              page=ctx.new_page()

              def on_response(resp):
                  u=resp.url
                  if "api-wh.picuki.site" in u or "picuki.site/api/" in u:
                      print("API_RESPONSE",resp.status,u)
                      try:
                          ct=(resp.headers.get("content-type") or "").lower()
                          if "json" in ct:
                              j=resp.json()
                              captured.append({"url":u,"json":j})
                              walk(j)
                              print("API_JSON_KEYS", list(j.keys()) if isinstance(j,dict) else type(j).__name__)
                          else:
                              txt=resp.text()
                              captured.append({"url":u,"text":txt[:20000]})
                              print("API_TEXT",txt[:500])
                      except Exception as e:
                          print("API_CAPTURE_ERR",repr(e))
              page.on("response",on_response)

              url=f"https://picuki.site/instagram-profile-viewer?profile={target}"
              print("OPEN_DIRECT",url)
              page.goto(url,wait_until="domcontentloaded",timeout=35000)
              page.wait_for_timeout(12000)

              # If a Turnstile/captcha appeared, record it instead of pretending.
              print("TITLE",page.title(),"URL",page.url)
              text=page.locator("body").inner_text(timeout=10000)
              print("BODY_HEAD",re.sub(r"\s+"," ",text[:5000]))
              (dbg/"body.txt").write_text(text)
              (dbg/"captured.json").write_text(json.dumps(captured,ensure_ascii=False,indent=2,default=str))

              # Click load-more style controls a few times if present.
              for _ in range(4):
                  clicked=False
                  for pat in ["load more","more posts","show more"]:
                      loc=page.get_by_text(re.compile(pat,re.I))
                      for i in range(min(loc.count(),3)):
                          try:
                              if loc.nth(i).is_visible():
                                  loc.nth(i).click(timeout=2000)
                                  page.wait_for_timeout(1800)
                                  clicked=True
                                  break
                          except: pass
                      if clicked: break
                  if not clicked: break

              # Harvest every link/src now rendered.
              items=page.evaluate("""() => {
                const a=[];
                for(const el of document.querySelectorAll('a,img,video,source')){
                  for(const k of ['href','src','data-src','poster']){
                    const v=el.getAttribute(k); if(v) a.push({tag:el.tagName,attr:k,v,text:(el.innerText||'').trim().slice(0,80)});
                  }
                }
                return a;
              }""")
              (dbg/"dom.json").write_text(json.dumps(items,ensure_ascii=False,indent=2))
              for it in items:
                  v=it["v"]
                  if v.startswith("/"): v=urljoin(page.url,v)
                  add(v)

              print("URL_COUNT",len(urls))
              for u in urls[:120]: print("URL",u[:600])

              pics=[]; vids=[]
              # Prefer URLs whose field/path suggests actual downloads/media.
              def rank(u):
                  lu=u.lower()
                  score=0
                  for k in ["download","media.picuki.site","cdninstagram","fbcdn","scontent",".mp4",".jpg",".jpeg",".webp",".png"]:
                      if k in lu: score+=1
                  return -score
              for u in sorted(urls,key=rank):
                  if len(pics)>=3 and len(vids)>=3: break
                  if any(x in u.lower() for x in ["google","doubleclick","analytics","svg","css","js?","fonts"]): continue
                  try:
                      r=ctx.request.get(u,timeout=25000,fail_on_status_code=False)
                      ct=(r.headers.get("content-type") or "").lower()
                      body=r.body()
                      if r.status>=400 or len(body)<5000: continue
                      isvid=("video/" in ct) or (len(body)>12 and body[4:8]==b"ftyp")
                      isimg=("image/" in ct) or body[:3]==b"\xff\xd8\xff" or body[:8]==b"\x89PNG\r\n\x1a\n" or (body[:4]==b"RIFF" and body[8:12]==b"WEBP")
                      if isvid and len(vids)<3:
                          p=out/f"arcana_events_video_{len(vids)+1}.mp4"; p.write_bytes(body); vids.append(p)
                          print("SAVED_VIDEO",p.name,len(body),ct,u[:300])
                      elif isimg and len(pics)<3:
                          ext=".webp" if "webp" in ct else (".png" if "png" in ct else ".jpg")
                          p=out/f"arcana_events_photo_{len(pics)+1}{ext}"; p.write_bytes(body); pics.append(p)
                          print("SAVED_PHOTO",p.name,len(body),ct,u[:300])
                  except Exception as e:
                      print("FETCH_ERR",u[:180],repr(e))

              browser.close()

          print("FINAL",len(pics),"photos",len(vids),"videos")
          for p in out.iterdir(): print("FILE",p.name,p.stat().st_size)
          if len(pics)<3 or len(vids)<3:
              raise SystemExit("INSUFFICIENT_MEDIA")
          PY
      - name: Upload media
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arcana-events-media
          path: selected/
          if-no-files-found: warn
          retention-days: 1
      - name: Upload debug
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: arcana-debug
          path: debug/
          if-no-files-found: warn
          retention-days: 1
