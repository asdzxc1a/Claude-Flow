name: Fetch Arcana media via ThePicuki
on:
  push:
    branches: ["main"]
  workflow_dispatch:
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q playwright requests
      - name: Resolve public media
        shell: bash
        run: |
          mkdir -p selected debug
          timeout 360s python - <<'PY'
          import json,re,shutil,hashlib
          from pathlib import Path
          from urllib.parse import urljoin,urlparse
          from playwright.sync_api import sync_playwright

          TARGET="arcana_events"
          OUT=Path("selected"); DBG=Path("debug")
          candidates=[]; seen=set(); response_dump=[]

          def add(u,src):
              if not isinstance(u,str): return
              u=u.strip().replace("&amp;","&")
              if u.startswith("//"): u="https:"+u
              if not u.startswith("http"): return
              lu=u.lower()
              if any(x in lu for x in ["googletagmanager","google-analytics","doubleclick","fonts.","favicon","logo","/assets/","/css/","/js/"]): return
              key=u
              if key not in seen:
                  seen.add(key); candidates.append({"url":u,"source":src})

          def walk(x,src):
              if isinstance(x,dict):
                  for k,v in x.items():
                      if isinstance(v,str) and (v.startswith("http") or "url" in str(k).lower() or "src" in str(k).lower()):
                          add(v,src+":"+str(k))
                      walk(v,src+":"+str(k))
              elif isinstance(x,list):
                  for i,v in enumerate(x): walk(v,src+f":{i}")
              elif isinstance(x,str) and x.startswith("http"):
                  add(x,src)

          with sync_playwright() as pw:
              chrome=shutil.which("google-chrome") or shutil.which("chromium")
              print("CHROME",chrome)
              browser=pw.chromium.launch(headless=True,executable_path=chrome,args=["--no-sandbox","--disable-blink-features=AutomationControlled"])
              ctx=browser.new_context(viewport={"width":1440,"height":1200},locale="en-US",
                  user_agent="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36",
                  accept_downloads=True)

              def attach(page,label):
                  def onresp(resp):
                      u=resp.url
                      lu=u.lower()
                      if any(k in lu for k in ["api","search","profile","photo","video","reel","instagram"]) and "google" not in lu:
                          try:
                              ct=(resp.headers.get("content-type") or "").lower()
                              rec={"url":u,"status":resp.status,"ct":ct}
                              if "json" in ct:
                                  j=resp.json(); rec["json"]=j; walk(j,label+":json")
                                  print("JSON_RESP",label,resp.status,u, str(j)[:1200])
                              elif "text" in ct or "html" in ct:
                                  txt=resp.text()
                                  rec["text"]=txt[:12000]
                                  for m in re.findall(r'https?://[^"\'<>\\ ]+',txt):
                                      add(m,label+":text")
                                  print("TEXT_RESP",label,resp.status,u,len(txt))
                              response_dump.append(rec)
                          except Exception as e:
                              print("RESP_ERR",label,u,repr(e))
                  page.on("response",onresp)

              def harvest(page,label):
                  try:
                      page.wait_for_timeout(1300)
                      data=page.evaluate("""() => {
                        const items=[];
                        for(const el of document.querySelectorAll('a[href],img[src],video[src],source[src],video[poster]')){
                          for(const k of ['href','src','poster','data-src','data-url','data-download']){
                            const v=el.getAttribute(k);
                            if(v) items.push({tag:el.tagName,attr:k,v,text:(el.innerText||el.alt||'').trim().slice(0,180),cls:el.className||''});
                          }
                        }
                        return {url:location.href,title:document.title,body:document.body.innerText.slice(0,16000),items,
                                perf:performance.getEntriesByType('resource').map(x=>x.name)};
                      }""")
                      (DBG/f"{label}.json").write_text(json.dumps(data,ensure_ascii=False,indent=2))
                      print("HARVEST",label,data["url"],"items",len(data["items"]),"body",re.sub(r"\s+"," ",data["body"][:2500]))
                      base=data["url"]
                      for it in data["items"]:
                          v=it["v"]
                          if v.startswith("/"): v=urljoin(base,v)
                          lv=v.lower(); meta=(it["text"]+" "+str(it["cls"])).lower()
                          if it["tag"] in ("IMG","VIDEO","SOURCE") or "download" in meta or any(k in lv for k in [".mp4",".jpg",".jpeg",".webp",".png","cdninstagram","fbcdn","scontent"]):
                              add(v,label+":"+it["tag"]+":"+it["attr"]+":"+it["text"][:50])
                      for v in data["perf"]:
                          lv=v.lower()
                          if any(k in lv for k in [".mp4",".jpg",".jpeg",".webp",".png","cdninstagram","fbcdn","scontent"]):
                              add(v,label+":perf")
                      return data
                  except Exception as e:
                      print("HARVEST_ERR",label,repr(e)); return {}

              def submit_username(url,label):
                  page=ctx.new_page(); attach(page,label)
                  try:
                      page.goto(url,wait_until="domcontentloaded",timeout=35000)
                      page.wait_for_timeout(1500)
                      print("OPEN",label,page.url,page.title())
                      inputs=page.locator("input")
                      chosen=None
                      scored=[]
                      for i in range(inputs.count()):
                          try:
                              inp=inputs.nth(i)
                              if not inp.is_visible(): continue
                              typ=(inp.get_attribute("type") or "text").lower()
                              if typ in ("hidden","button","submit","file"): continue
                              ph=(inp.get_attribute("placeholder") or "").lower()
                              name=(inp.get_attribute("name") or "").lower()
                              score=("username" in ph)*5+("instagram" in ph)*3+("profile" in ph)*2+("user" in name)*2
                              scored.append((score,i,ph,name))
                          except: pass
                      print("INPUTS",label,scored)
                      if scored:
                          _,i,_,_=sorted(scored,reverse=True)[0]
                          inp=inputs.nth(i); inp.fill(TARGET)
                          try: inp.press("Enter")
                          except: pass
                          page.wait_for_timeout(1500)
                          # If Enter didn't move things, click likely submit button.
                          body0=page.locator("body").inner_text()
                          buttons=page.locator("button")
                          for j in range(min(buttons.count(),30)):
                              try:
                                  b=buttons.nth(j)
                                  if not b.is_visible(): continue
                                  txt=(b.inner_text() or "").lower()
                                  if any(k in txt for k in ["view","browse","search","download","profile"]):
                                      b.click(timeout=2000)
                                      print("CLICK_BUTTON",label,j,txt)
                                      break
                              except: pass
                          try: page.wait_for_load_state("domcontentloaded",timeout=12000)
                          except: pass
                          page.wait_for_timeout(7000)
                      for _ in range(4):
                          page.evaluate("window.scrollTo(0,document.body.scrollHeight)")
                          page.wait_for_timeout(500)
                      data=harvest(page,label)
                      return page,data
                  except Exception as e:
                      print("SUBMIT_ERR",label,repr(e)); harvest(page,label+"_err"); return page,{}

              pages=[]
              for url,label in [
                  ("https://thepicuki.com/","home"),
                  ("https://thepicuki.com/instagram-profile-viewer/","profile"),
                  ("https://thepicuki.com/instagram-photo-downloader/","photos"),
                  ("https://thepicuki.com/instagram-reels-viewer/","reels"),
                  ("https://thepicuki.com/instagram-video-downloader/","videos"),
              ]:
                  p,d=submit_username(url,label); pages.append((p,label))
                  if len(candidates)>60: break

              # Open any result/post/reel URLs discovered on ThePicuki and harvest them.
              result_urls=[]
              for item in list(candidates):
                  u=item["url"]
                  if "thepicuki.com" in urlparse(u).netloc and re.search(r'/(?:profile|user|post|reel|media|instagram)/',urlparse(u).path,re.I):
                      if u not in result_urls: result_urls.append(u)
              for i,u in enumerate(result_urls[:25]):
                  try:
                      p=ctx.new_page(); attach(p,f"result_{i}")
                      p.goto(u,wait_until="domcontentloaded",timeout=25000); p.wait_for_timeout(1200)
                      harvest(p,f"result_{i}"); p.close()
                  except Exception as e: print("RESULT_ERR",u,repr(e))

              print("CANDIDATES",len(candidates))
              for x in candidates[:160]: print("CANDIDATE",x["source"],x["url"][:700])
              (DBG/"responses.json").write_text(json.dumps(response_dump,ensure_ascii=False,indent=2,default=str))
              (DBG/"candidates.json").write_text(json.dumps(candidates,ensure_ascii=False,indent=2))

              pics=[]; vids=[]; hashes=set()
              def pri(x):
                  u=x["url"].lower(); s=x["source"].lower(); score=0
                  if any(h in u for h in ["cdninstagram","fbcdn","scontent"]): score+=10
                  if ".mp4" in u: score+=9
                  if any(e in u for e in [".jpg",".jpeg",".webp",".png"]): score+=7
                  if "download" in s or "download" in u: score+=6
                  if any(k in s for k in ["json","result","photos","videos","reels"]): score+=4
                  return -score

              for item in sorted(candidates,key=pri):
                  if len(pics)>=3 and len(vids)>=3: break
                  u=item["url"]; lu=u.lower()
                  if "thepicuki.com" in urlparse(u).netloc and any(k in lu for k in ["/images/","/assets/","/icons/","logo","favicon",".svg"]): continue
                  try:
                      r=ctx.request.get(u,timeout=30000,fail_on_status_code=False,headers={"Referer":"https://thepicuki.com/"})
                      ct=(r.headers.get("content-type") or "").lower(); b=r.body()
                      if r.status>=400 or len(b)<12000: continue
                      h=hashlib.sha256(b).hexdigest()
                      if h in hashes: continue
                      isv="video/" in ct or (len(b)>12 and b[4:8]==b"ftyp")
                      isi="image/" in ct or b[:3]==b"\xff\xd8\xff" or b[:8]==b"\x89PNG\r\n\x1a\n" or (len(b)>12 and b[:4]==b"RIFF" and b[8:12]==b"WEBP")
                      if isv and len(vids)<3:
                          hashes.add(h); p=OUT/f"arcana_events_video_{len(vids)+1}.mp4"; p.write_bytes(b); vids.append(p)
                          print("SAVED_VIDEO",p.name,len(b),ct,item["source"],u[:350])
                      elif isi and len(pics)<3 and len(b)>=40000:
                          hashes.add(h); ext=".webp" if "webp" in ct else (".png" if "png" in ct else ".jpg")
                          p=OUT/f"arcana_events_photo_{len(pics)+1}{ext}"; p.write_bytes(b); pics.append(p)
                          print("SAVED_PHOTO",p.name,len(b),ct,item["source"],u[:350])
                  except Exception as e: print("DL_ERR",u[:180],repr(e))

              browser.close()

          print("FINAL",len(pics),len(vids))
          for p in sorted(OUT.iterdir()): print("FILE",p.name,p.stat().st_size)
          if len(pics)<3 or len(vids)<3: raise SystemExit("INSUFFICIENT_MEDIA")
          PY
      - name: Verify
        if: success()
        run: |
          file selected/*
          test "$(find selected -type f -iname '*.mp4' | wc -l)" -eq 3
          test "$(find selected -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' \) | wc -l)" -eq 3
      - name: Upload media
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arcana-events-media
          path: selected/
          if-no-files-found: warn
          retention-days: 1
      - name: Upload debug
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: arcana-thepicuki-debug
          path: debug/
          if-no-files-found: warn
          retention-days: 1
