name: Fetch Arcana media via Tracygram API
on:
  push:
    branches: ["main"]
  workflow_dispatch:
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: Fetch verified target media
        shell: bash
        run: |
          mkdir -p selected debug
          python - <<'PY'
          import json, os, hashlib, time
          from pathlib import Path
          import requests

          TARGET="arcana_events"
          OUT=Path("selected")
          DBG=Path("debug")
          s=requests.Session()
          s.headers.update({
              "User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36",
              "Accept":"application/json,text/plain,*/*",
              "Referer":f"https://tracygram.com/viewer?u={TARGET}",
              "Origin":"https://tracygram.com",
          })

          def get_json(url, params=None):
              r=s.get(url,params=params,timeout=30)
              print("GET",r.url,"STATUS",r.status_code,"CT",r.headers.get("content-type"),"LEN",len(r.content))
              print("HEAD",r.text[:700].replace("\n"," "))
              r.raise_for_status()
              j=r.json()
              return j

          # Strict identity check: reject samples/defaults/renamed results.
          user=get_json("https://tracygram.com/api/user",{"username":TARGET})
          (DBG/"user.json").write_text(json.dumps(user,ensure_ascii=False,indent=2))
          if not user.get("success"):
              raise SystemExit("USER_LOOKUP_FAILED")
          returned=(user.get("username") or "").lstrip("@").lower()
          print("RETURNED_USERNAME",returned)
          if returned != TARGET.lower():
              raise SystemExit(f"WRONG_PROFILE:{returned}")
          if user.get("is_private"):
              raise SystemExit("TARGET_IS_PRIVATE")
          uid=user.get("user_id")
          print("VERIFIED_TARGET",TARGET,"USER_ID",uid,"FULL_NAME",user.get("full_name"))

          # Fetch first page and attempt several observed/common cursor parameter names
          # only when more pages are needed.
          pages=[]
          first=get_json("https://tracygram.com/api/posts",{"username":TARGET})
          pages.append(first)
          (DBG/"posts_page_1.json").write_text(json.dumps(first,ensure_ascii=False,indent=2))

          def flatten(posts):
              out=[]
              for post in posts:
                  shortcode=post.get("shortcode")
                  post_url=post.get("url")
                  slides=post.get("slides") or []
                  if slides:
                      for idx,sl in enumerate(slides):
                          out.append({
                            "shortcode":shortcode,"post_url":post_url,"slide":idx+1,
                            "is_video":bool(sl.get("is_video")),
                            "media_url":sl.get("media_url"),
                            "thumbnail":sl.get("thumbnail") or sl.get("poster")
                          })
                  else:
                      out.append({
                        "shortcode":shortcode,"post_url":post_url,"slide":1,
                        "is_video":bool(post.get("is_video")),
                        "media_url":post.get("media_url"),
                        "thumbnail":post.get("thumbnail") or post.get("poster")
                      })
              return out

          all_posts=list(first.get("posts") or [])
          seen_shortcodes={p.get("shortcode") for p in all_posts}
          def counts():
              items=flatten(all_posts)
              photos=sum(1 for x in items if not x["is_video"] and x.get("media_url"))
              videos=sum(1 for x in items if x["is_video"] and x.get("media_url"))
              return photos,videos
          print("PAGE1_POSTS",len(all_posts),"MEDIA_COUNTS",counts(),"HAS_NEXT",first.get("has_next_page"))

          page_no=1
          cursor=first.get("end_cursor")
          # Discover the accepted pagination argument safely by trying standard names.
          while cursor and page_no<5 and counts()[1] < 3:
              got_new=False
              for key in ["cursor","after","end_cursor","max_id"]:
                  try:
                      j=get_json("https://tracygram.com/api/posts",{"username":TARGET,key:cursor})
                  except Exception as e:
                      print("CURSOR_ERR",key,repr(e)); continue
                  new=[p for p in (j.get("posts") or []) if p.get("shortcode") not in seen_shortcodes]
                  print("CURSOR_TRY",key,"posts",len(j.get("posts") or []),"new",len(new),"next",j.get("has_next_page"))
                  if new:
                      page_no+=1
                      pages.append(j)
                      (DBG/f"posts_page_{page_no}.json").write_text(json.dumps(j,ensure_ascii=False,indent=2))
                      all_posts.extend(new)
                      seen_shortcodes.update(p.get("shortcode") for p in new)
                      cursor=j.get("end_cursor")
                      got_new=True
                      break
              if not got_new:
                  break
              print("TOTAL_POSTS",len(all_posts),"MEDIA_COUNTS",counts())

          items=flatten(all_posts)
          (DBG/"flattened_media.json").write_text(json.dumps(items,ensure_ascii=False,indent=2))
          print("TOTAL_ITEMS",len(items),"COUNTS",counts())
          for x in items:
              print("ITEM",x["shortcode"],"slide",x["slide"],"video",x["is_video"],"post",x["post_url"],"media",str(x["media_url"])[:250])

          pics=[]; vids=[]; hashes=set(); manifest=[]
          # Prefer full media_url, never thumbnails; this keeps photos distinct from video posters.
          for x in items:
              if len(pics)>=3 and len(vids)>=3:
                  break
              u=x.get("media_url")
              if not u:
                  continue
              want_video=x["is_video"]
              if want_video and len(vids)>=3: continue
              if (not want_video) and len(pics)>=3: continue
              try:
                  r=s.get(u,timeout=45,headers={"Referer":"https://www.instagram.com/"})
                  print("MEDIA_GET",x["shortcode"],x["slide"],r.status_code,r.headers.get("content-type"),len(r.content))
                  if r.status_code>=400 or len(r.content)<10000: continue
                  b=r.content; ct=(r.headers.get("content-type") or "").lower()
                  h=hashlib.sha256(b).hexdigest()
                  if h in hashes: continue
                  sig_video=("video/" in ct) or (len(b)>12 and b[4:8]==b"ftyp")
                  sig_image=("image/" in ct) or b[:3]==b"\xff\xd8\xff" or b[:8]==b"\x89PNG\r\n\x1a\n" or (len(b)>12 and b[:4]==b"RIFF" and b[8:12]==b"WEBP")
                  if want_video and not sig_video:
                      print("TYPE_MISMATCH_EXPECT_VIDEO",ct); continue
                  if (not want_video) and not sig_image:
                      print("TYPE_MISMATCH_EXPECT_IMAGE",ct); continue

                  hashes.add(h)
                  if want_video:
                      n=len(vids)+1
                      p=OUT/f"arcana_events_video_{n}.mp4"
                      p.write_bytes(b); vids.append(p)
                      kind="video"
                  else:
                      n=len(pics)+1
                      ext=".webp" if "webp" in ct else (".png" if "png" in ct else ".jpg")
                      p=OUT/f"arcana_events_photo_{n}{ext}"
                      p.write_bytes(b); pics.append(p)
                      kind="photo"
                  manifest.append({
                    "file":p.name,"kind":kind,"bytes":len(b),
                    "shortcode":x["shortcode"],"slide":x["slide"],
                    "instagram_post":x["post_url"],"sha256":h
                  })
                  print("SAVED",p.name,len(b),"FROM",x["post_url"],"SLIDE",x["slide"])
              except Exception as e:
                  print("MEDIA_ERR",x["shortcode"],x["slide"],repr(e))

          (OUT/"manifest.json").write_text(json.dumps({
              "verified_username":returned,
              "verified_user_id":uid,
              "files":manifest
          },ensure_ascii=False,indent=2))

          print("FINAL_COUNTS",len(pics),len(vids))
          for p in sorted(OUT.iterdir()):
              print("FINAL_FILE",p.name,p.stat().st_size)
          if len(pics)!=3 or len(vids)!=3:
              raise SystemExit(f"INSUFFICIENT_TARGET_MEDIA photos={len(pics)} videos={len(vids)}")
          PY
      - name: Verify exact deliverable
        run: |
          file selected/*
          test "$(find selected -maxdepth 1 -type f -iname '*.mp4' | wc -l)" -eq 3
          test "$(find selected -maxdepth 1 -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' \) | wc -l)" -eq 3
      - name: Upload media
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arcana-events-media-verified
          path: selected/
          if-no-files-found: warn
          retention-days: 1
      - name: Upload debug
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: arcana-tracygram-debug
          path: debug/
          if-no-files-found: warn
          retention-days: 1
